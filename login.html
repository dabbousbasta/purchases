<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>دخول صفحة المشتريات</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      font-family: "Tajawal", sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #f3e5f5, #ede7f6, #fff3e0);
      color: #222;
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      padding: 30px 25px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(69, 39, 160, 0.18);
      border: 1px solid #e4d9f3;
    }

    .icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #ede7f6;
      color: #5e35b1;
      font-size: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      text-align: center;
      color: #4527a0;
    }

    .intro {
      margin: 0 0 24px;
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      line-height: 1.7;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #444;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #d4c7e8;
      border-radius: 10px;
      outline: none;
      font: inherit;
      direction: ltr;
      text-align: left;
      transition: 0.15s ease;
    }

    input:focus {
      border-color: #5e35b1;
      box-shadow: 0 0 0 3px rgba(94, 53, 177, 0.14);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      color: #fff;
      background: #5e35b1;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: #4527a0;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 9px;
      font-size: 0.86rem;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      color: #842029;
      background: #f8d7da;
      border: 1px solid #f5c2c7;
    }

    .message.success {
      display: block;
      color: #0f5132;
      background: #d1e7dd;
      border: 1px solid #badbcc;
    }

    .small-note {
      margin-top: 18px;
      text-align: center;
      color: #888;
      font-size: 0.78rem;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="icon">🔒</div>

    <h1>دخول صفحة المشتريات</h1>

    <p class="intro">
      أدخل البريد الإلكتروني وكلمة المرور للوصول إلى أسعار ومعلومات المشتريات.
    </p>

    <form id="loginForm">
      <label for="email">البريد الإلكتروني</label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="name@example.com"
        required
      />

      <label for="password">كلمة المرور</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="أدخل كلمة المرور"
        required
      />

      <button id="loginButton" type="submit">
        دخول
      </button>
    </form>

    <div id="message" class="message"></div>

    <div class="small-note">
      الوصول متاح فقط للمستخدمين المسجلين.
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://iknywaocqwjxrvdlryac.supabase.co";

    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlrbnl3YW9jcXdqeHJ2ZGxyeWFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5ODIxNDMsImV4cCI6MjEwMzU1ODE0M30.w1zZVEgL30T8T3mTuCh7Kl4tjQu4_ugkLuZdwt8wS_k";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const messageBox = document.getElementById("message");

    function showMessage(text, type = "error") {
      messageBox.textContent = text;
      messageBox.className = "message " + type;
    }

    function clearMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    async function checkExistingSession() {
      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (session) {
        window.location.replace("index.html");
      }
    }

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      clearMessage();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("أدخل البريد الإلكتروني وكلمة المرور.");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "جاري التحقق...";

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        console.error(error);

        showMessage(
          "تعذر تسجيل الدخول. تأكد من البريد الإلكتروني وكلمة المرور."
        );

        loginButton.disabled = false;
        loginButton.textContent = "دخول";
        return;
      }

      if (!data.session) {
        showMessage("تم التحقق من الحساب، لكن لم يتم إنشاء جلسة دخول. حاول مجددًا.");
        loginButton.disabled = false;
        loginButton.textContent = "دخول";
        return;
      }

      showMessage("تم تسجيل الدخول بنجاح. جاري فتح صفحة المشتريات...", "success");

      window.location.replace("index.html");
    });

    checkExistingSession();
  </script>
</body>
</html>
